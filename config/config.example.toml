# Copia este archivo como config.toml y ajústalo. Úsalo con:
#   f1-strategist run --config config.toml

[telemetry]
# "127.0.0.1": solo recibe del mismo PC (juego y aplicación en el mismo equipo).
# "0.0.0.0" o la IP de la interfaz LAN: recibe desde otro PC de la red local.
listen_address = "127.0.0.1"
# Debe coincidir con el puerto configurado en la telemetría UDP del juego.
listen_port = 20777
# Opcional: aceptar paquetes solo de estas IP (por ejemplo, la del PC del juego).
allowed_sources = []
# Segundos sin datos antes de mostrar el diagnóstico.
no_data_warning_s = 3.0

[capture]
enabled = true
directory = "captures"

[recording]
# Graba la sesión en SQLite a partir de la captura cruda (derivable con `ingest`).
# Activada por defecto (decisión D3): el motor de estrategia necesita el registro
# de evaluaciones. Desactívala con `enabled = false` si no quieres escribir en disco.
enabled = true
database = "captures/sessions.db"
# Cadencia máxima de las muestras de métricas y tamaño de la cola del grabador.
metrics_interval_s = 1.0
queue_size = 1000
batch_size = 100
flush_interval_s = 0.5

[metrics]
# Intervalo mínimo entre publicaciones de métricas.
publish_interval_s = 0.5
# Máximo de vueltas retenidas por coche.
history_max_laps = 100
# Ventanas de cálculo para ritmo y consumo de combustible.
pace_window_laps = 5
fuel_window_laps = 5
# Muestras mínimas para las calidades low y ok.
min_samples_low = 3
min_samples_ok = 5
# Vueltas limpias mínimas para considerar representativa una tanda del fin de semana.
min_representative_laps = 3
# Umbral de tráfico y ventana de tendencia de intervalos.
traffic_gap_s = 1.0
traffic_lap_fraction = 0.5
gap_trend_window_s = 10.0
# Cambio de daño que marca una vuelta como no comparable.
damage_change_threshold_pct = 5
# Parámetros opcionales: omítelos para dejarlos desactivados (None).
# fuel_effect_s_per_kg = 0.03
# tyre_wear_limit_pct = 70
# ers_capacity_joules = 4000000

# Umbrales por familia (opcional; combustible usa 2/3 por defecto).
[metrics.min_samples.fuel]
low = 2
ok = 3
#
# Para personalizar otra familia, añade otra sección:
# [metrics.min_samples.pace]
# low = 3
# ok = 5

[strategy]
# Motor de estrategia (Fase 4). Los valores "provisional" se calibran en la Fase 9.
enabled = true
# Intervalo mínimo entre evaluaciones (nunca se evalúa por paquete).
evaluation_min_interval_s = 1.0
# Ganancia mínima, en el límite inferior del intervalo, para recomendar parar.
min_gain_s = 1.0
# Banda de sensibilidad de la pendiente de desgaste (provisional; Suzuka, n = 1).
wear_slope_band_pct = 15.0
# Banda de pérdida en boxes cuando solo hay una fuente.
pit_loss_band_s = 2.0
# Fuerza del prior del fin de semana.
prior_strength_k = 3.0
# Horizonte de PIT_IN(n) si el juego no da una ventana.
max_pit_in_laps = 10
# Regla de dos compuestos secos (a confirmar en el juego).
require_two_dry_compounds = true
# Parámetros opcionales: omítelos para dejarlos desactivados (None).
# traffic_cost_s_per_lap = 0.4
# cliff_penalty_s_per_lap = 0.5
# pit_loss_override_s = 21.0

# Anulaciones por circuito (opcional); solo los campos que cambian.
# [strategy.tracks.monza]
# min_gain_s = 1.5
# pit_loss_override_s = 20.5

[events]
# Detector de eventos (Fase 5). Todos los valores son provisionales.
enabled = true

[events.strategy]
# Confianza mínima para anunciar una recomendación de parada.
min_confidence = 0.5
# Cambio de ganancia que justifica actualizar el aviso.
update_delta_s = 2.0

[events.pit_window]
# Vueltas de antelación del aviso de ventana de parada.
lead_laps = 1

[events.fuel]
# Margen de combustible, en vueltas, para avisar y para el aviso crítico.
warn_laps = 0.5
critical_laps = 0.0
# Histéresis para no repetir el aviso al oscilar alrededor del umbral.
# Debe ser mayor que cero para que el cierre quede al otro lado del umbral.
hysteresis_laps = 0.3
# Cambio de margen que justifica actualizar el aviso (sin valor universal;
# omítelo para no actualizar por variación del margen).
# update_delta_laps = 0.1

[events.tyres]
# Vueltas útiles restantes para avisar del final de vida del neumático.
warn_laps = 3.0
# Desgaste observado frente al esperado y su histéresis.
# La histéresis debe ser mayor que cero para que el cierre quede por debajo.
degradation_ratio = 0.25
hysteresis = 0.10
# Tanda mínima para juzgar la degradación.
min_stint_laps = 4

[events.weather]
# Probabilidad de lluvia a 10 minutos para abrir y cerrar el aviso.
# El umbral de salida debe ser estrictamente menor que el de entrada.
rain_enter_pct = 50.0
rain_exit_pct = 30.0
# Cambio de probabilidad que justifica actualizar el aviso (sin valor universal;
# omítelo para no actualizar por variación de la probabilidad).
# update_delta_pct = 10.0

[events.data]
# Segundos de datos obsoletos antes de avisar.
stale_persistence_s = 3.0

[events.damage]
# Daño de ala, suelo o caja que se anuncia y cambio que fuerza actualización.
warn_pct = 15.0
update_delta_pct = 10.0

[events.rivals]
# Distancia para considerar adyacente a un rival.
gap_s = 2.0

[gate]
# Compuerta de avisos (Fase 5). Todos los valores son provisionales.
enabled = true
# Separación mínima entre avisos no críticos.
global_min_gap_s = 8.0
# Ventana de supresión de avisos equivalentes.
equivalence_window_s = 90.0
# Intervalo mínimo entre actualizaciones de un mismo aviso.
update_min_interval_s = 30.0
# Cuánto se mantiene un aviso diferido antes de descartarlo.
defer_max_s = 20.0
# Vueltas iniciales sin avisos informativos.
quiet_first_laps = 1
# Hueco tras un aviso estratégico o crítico.
informational_space_s = 30.0
# Silencio tras una interacción del piloto.
pilot_quiet_s = 15.0
# Nivel de interrupción: "all", "strategic" o "critical".
interruption_level = "all"
# Silencia al agente sin detener la captura.
muted = false

[gate.cooldown_s]
# Cooldown por prioridad, en segundos.
strategic = 45.0
informational = 120.0

[llm]
# Integración del LLM (Fase 6). Desactivado, todo usa plantillas.
enabled = false
# Endpoint compatible con OpenAI; puede ser otro PC de la red local.
endpoint = "http://127.0.0.1:1234/v1"
# Obligatorio si enabled = true.
model = ""
# Mejor definir F1_LLM_API_KEY en el entorno; aquí nunca se muestra ni se registra.
# api_key = "…"
temperature = 0.3
# top_p = 0.9
# seed = 0
max_tokens = 120
# Streaming para medir el primer token y poder cancelar.
stream = true
# "auto", "json_schema", "json_object" o "none".
structured_output = "auto"
connect_timeout_s = 2.0
max_in_flight = 1
health_interval_s = 30.0
extra_body = {}

[agent]
# Comunicación con el piloto. Todos los valores son provisionales.
language = "es"
max_words = 30
max_chars = 220
critical_uses_llm = false
timeout_critical_s = 1.5
timeout_strategic_s = 6.0
timeout_informational_s = 6.0
# "template" o "drop" (solo informativos).
fallback_on_failure = "template"
max_alert_age_s = 15.0
recent_messages = 3
context_token_budget = 900
# "template", "recorded" o "live".
offline_mode = "template"
record_context = true
imperative_phrases = ["entra a boxes", "boxea ahora", "ataca ahora", "empuja ahora"]
