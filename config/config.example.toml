# Copia este archivo como config.toml y ajústalo. Úsalo con:
#   f1-strategist run --config config.toml

[telemetry]
# "127.0.0.1": solo recibe del mismo PC (juego y aplicación en el mismo equipo).
# "0.0.0.0" o la IP de la interfaz LAN: recibe desde otro PC de la red local.
listen_address = "127.0.0.1"
# Debe coincidir con el puerto configurado en la telemetría UDP del juego.
listen_port = 20777
# Opcional: aceptar paquetes solo de estas IP (por ejemplo, la del PC del juego).
allowed_sources = []
# Segundos sin datos antes de mostrar el diagnóstico.
no_data_warning_s = 3.0

[capture]
enabled = true
directory = "captures"

[recording]
# Graba la sesión en SQLite a partir de la captura cruda (derivable con `ingest`).
# Activada por defecto (decisión D3): el motor de estrategia necesita el registro
# de evaluaciones. Desactívala con `enabled = false` si no quieres escribir en disco.
enabled = true
database = "captures/sessions.db"
# Cadencia máxima de las muestras de métricas y tamaño de la cola del grabador.
metrics_interval_s = 1.0
queue_size = 1000
batch_size = 100
flush_interval_s = 0.5

[metrics]
# Intervalo mínimo entre publicaciones de métricas.
publish_interval_s = 0.5
# Máximo de vueltas retenidas por coche.
history_max_laps = 100
# Ventanas de cálculo para ritmo y consumo de combustible.
pace_window_laps = 5
fuel_window_laps = 5
# Muestras mínimas para las calidades low y ok.
min_samples_low = 3
min_samples_ok = 5
# Vueltas limpias mínimas para considerar representativa una tanda del fin de semana.
min_representative_laps = 3
# Umbral de tráfico y ventana de tendencia de intervalos.
traffic_gap_s = 1.0
traffic_lap_fraction = 0.5
gap_trend_window_s = 10.0
# Cambio de daño que marca una vuelta como no comparable.
damage_change_threshold_pct = 5
# Parámetros opcionales: omítelos para dejarlos desactivados (None).
# fuel_effect_s_per_kg = 0.03
# tyre_wear_limit_pct = 70
# ers_capacity_joules = 4000000

# Umbrales por familia (opcional; combustible usa 2/3 por defecto).
[metrics.min_samples.fuel]
low = 2
ok = 3
#
# Para personalizar otra familia, añade otra sección:
# [metrics.min_samples.pace]
# low = 3
# ok = 5

[strategy]
# Motor de estrategia (Fase 4). Los valores "provisional" se calibran en la Fase 9.
enabled = true
# Intervalo mínimo entre evaluaciones (nunca se evalúa por paquete).
evaluation_min_interval_s = 1.0
# Ganancia mínima, en el límite inferior del intervalo, para recomendar parar.
min_gain_s = 1.0
# Banda de sensibilidad de la pendiente de desgaste (provisional; Suzuka, n = 1).
wear_slope_band_pct = 15.0
# Banda de pérdida en boxes cuando solo hay una fuente.
pit_loss_band_s = 2.0
# Fuerza del prior del fin de semana.
prior_strength_k = 3.0
# Horizonte de PIT_IN(n) si el juego no da una ventana.
max_pit_in_laps = 10
# Regla de dos compuestos secos (a confirmar en el juego).
require_two_dry_compounds = true
# Parámetros opcionales: omítelos para dejarlos desactivados (None).
# traffic_cost_s_per_lap = 0.4
# cliff_penalty_s_per_lap = 0.5
# pit_loss_override_s = 21.0

# Anulaciones por circuito (opcional); solo los campos que cambian.
# [strategy.tracks.monza]
# min_gain_s = 1.5
# pit_loss_override_s = 20.5
