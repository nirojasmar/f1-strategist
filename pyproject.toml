[project]
name = "f1-strategist"
version = "0.1.0"
description = "Ingeniero de carrera con IA para F1 25: telemetría UDP, estrategia y comunicación con el piloto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
f1-strategist = "f1_strategist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "hypothesis>=6.170.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_strategist"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not benchmark'"
markers = [
    "benchmark: mediciones de rendimiento no ejecutadas en la suite funcional",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
